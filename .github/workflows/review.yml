name: Reusable advisory AI review
on:
  workflow_call:
    inputs:
      model_url:
        required: true
        type: string
      chat_model:
        required: true
        type: string
      embedding_model:
        required: true
        type: string
    secrets:
      model_api_key:
        required: false
permissions:
  contents: read
  pull-requests: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned trusted reviewer, never the PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: reviewer
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install only trusted reviewer dependencies
        working-directory: reviewer
        run: python -m pip install -r requirements.txt
      - name: Review immutable target revisions
        working-directory: reviewer
        env:
          REVIEW_MODEL_URL: ${{ inputs.model_url }}
          REVIEW_CHAT_MODEL: ${{ inputs.chat_model }}
          REVIEW_EMBEDDING_MODEL: ${{ inputs.embedding_model }}
          REVIEW_MODEL_API_KEY: ${{ secrets.model_api_key }}
          REVIEW_GITHUB_TOKEN: ${{ github.token }}
        run: python -m review.ci
      - name: Publish advisory artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-artifacts/
          if-no-files-found: error
          retention-days: 7
