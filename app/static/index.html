<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Challenge — чат</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ── слева: список агентов ─────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">◆</span>
          <span class="brand-text">
            <span class="brand-name">AI Challenge</span>
            <span class="brand-sub">чат · день 11</span>
          </span>
        </div>
        <button class="icon-btn" id="sidebar-toggle" type="button"
                title="Свернуть список" aria-label="Свернуть список"></button>
      </header>

      <button class="new-chat" id="new-chat" type="button">
        <span class="plus" aria-hidden="true">+</span> Новый чат
      </button>

      <nav class="list" id="agent-list" aria-label="Агенты"></nav>

      <footer class="sidebar-foot">
        <button class="foot-btn" id="theme-toggle" type="button"></button>
      </footer>
    </aside>

    <!-- ── по центру: лента ──────────────────────────────────────────── -->
    <main class="chat">
      <div class="feed" id="feed"></div>

      <form class="composer" id="composer">
        <div class="composer-box">
          <textarea id="input" class="composer-input" rows="1"
                    placeholder="Напишите сообщение… (Shift+Enter — новая строка)"></textarea>
          <button class="send-btn" id="send" type="submit" title="Отправить"
                  aria-label="Отправить"></button>
        </div>
        <div class="composer-hint" id="composer-hint"></div>
      </form>
    </main>

    <!-- ── справа: настройки агента ──────────────────────────────────── -->
    <aside class="panel" id="panel">
      <header class="panel-head">
        <div class="tabs" role="tablist">
          <button class="tab active" id="tab-btn-model" data-tab="model" type="button" role="tab">Модель</button>
          <button class="tab" data-tab="agent" type="button" role="tab">Агент</button>
          <button class="tab" data-tab="memory" type="button" role="tab">Память</button>
        </div>
        <button class="icon-btn" id="panel-toggle" type="button"
                title="Свернуть настройки" aria-label="Свернуть настройки"></button>
      </header>

      <div class="panel-body" id="panel-body">
        <section class="tab-page" id="tab-model">
          <label class="field">
            <span class="field-label">Модель</span>
            <select id="f-model" class="control"></select>
          </label>
          <div class="warn hidden" id="model-warn" role="status"></div>

          <div class="grid2">
            <label class="field">
              <span class="field-label">Temperature</span>
              <input id="f-temperature" class="control" type="number" step="0.1" placeholder="по умолчанию">
            </label>
            <label class="field">
              <span class="field-label">Max tokens</span>
              <input id="f-max_tokens" class="control" type="number" step="1" placeholder="по умолчанию">
            </label>
          </div>

          <div class="grid3">
            <label class="field">
              <span class="field-label">Top P</span>
              <input id="f-top_p" class="control" type="number" step="0.05" placeholder="—">
            </label>
            <label class="field">
              <span class="field-label">Top K</span>
              <input id="f-top_k" class="control" type="number" step="1" placeholder="—">
            </label>
            <label class="field">
              <span class="field-label">Min P</span>
              <input id="f-min_p" class="control" type="number" step="0.01" placeholder="—">
            </label>
          </div>

          <div class="grid3">
            <label class="field">
              <span class="field-label">Rep. penalty</span>
              <input id="f-repetition_penalty" class="control" type="number" step="0.05" placeholder="—">
            </label>
            <label class="field">
              <span class="field-label">Pres. penalty</span>
              <input id="f-presence_penalty" class="control" type="number" step="0.1" placeholder="—">
            </label>
            <label class="field">
              <span class="field-label">Freq. penalty</span>
              <input id="f-frequency_penalty" class="control" type="number" step="0.1" placeholder="—">
            </label>
          </div>

          <label class="field">
            <span class="field-label">Формат ответа</span>
            <select id="f-response_format_kind" class="control">
              <option value="">не задан</option>
              <option value="json_object">JSON-объект</option>
              <option value="custom">свой JSON…</option>
            </select>
          </label>
          <label class="field hidden" id="response-format-custom">
            <span class="field-label">response_format, JSON</span>
            <textarea id="f-response_format" class="control area mono" rows="4"
                      placeholder='{"type": "json_schema", "json_schema": {…}}'></textarea>
          </label>

          <label class="field">
            <span class="field-label">Стоп-строки, по одной в строке</span>
            <textarea id="f-stop" class="control area mono" rows="3" placeholder="не заданы"></textarea>
          </label>

          <p class="hint">Пустое поле — параметр не отправляется вовсе.</p>
        </section>

        <section class="tab-page hidden" id="tab-agent">
          <!-- Пометка ветки: от кого чат отделился, сколько унёс и то, что он
               сам по себе. Не поле — менять происхождение нельзя: это не
               настройка. Спрятана разметкой, потому что у обычного чата её
               нет вовсе; кому её показать, решает `fillBranch` в app.js. -->
          <p class="branch-note hidden" id="branch-note" role="note"></p>

          <label class="field">
            <span class="field-label">Системный промпт</span>
            <textarea id="f-system" class="control area" rows="14" placeholder="без системного промпта"></textarea>
          </label>

          <!-- Поля контекста на всю ширину, а не в два столбца: подписи здесь длиннее
               соседских, и в узкой колонке они переносились на разное число строк,
               разводя поля ввода по высоте. Сетку это больше не задевает, а страховка
               от того же на любой длине подписи стоит в .grid2/.grid3 (style.css).

               Числа спрятаны в разметке, а не показаны: умолчание стратегии — `full`,
               а при ней не работает ни одно из них. Кто виден и как подписан, решает
               `syncStrategyFields` в app.js — одним местом на все четыре стратегии. -->
          <label class="field">
            <span class="field-label">Управление контекстом</span>
            <select id="f-strategy" class="control">
              <option value="full">Вся история</option>
              <option value="window">Скользящее окно</option>
              <option value="facts">Факты</option>
              <option value="summary">Суммаризация</option>
            </select>
          </label>
          <label class="field hidden" id="field-keep_last">
            <span class="field-label" id="label-keep_last">Размер окна, сообщений</span>
            <input id="f-keep_last" class="control" type="number" step="1" placeholder="вся история">
          </label>
          <label class="field hidden" id="field-compress_every">
            <span class="field-label" id="label-compress_every">Сжимать каждые, сообщений</span>
            <input id="f-compress_every" class="control" type="number" step="1" placeholder="—">
          </label>

          <!-- Долговременная память — третий слой памяти, общий на всю базу и
               наполняемый руками. Здесь только выключатель этого чата: включена —
               непустая память встаёт врезкой в промпт при ЛЮБОЙ стратегии,
               выключена — не встаёт. Поэтому поле не прячется вместе с числами
               контекста: оно не про историю, а про слой поверх неё, и пунктом
               переключателя стратегий не является. -->
          <label class="field">
            <span class="field-label">Долговременная память</span>
            <select id="f-memory" class="control">
              <option value="on">Включена</option>
              <option value="off">Выключена</option>
            </select>
          </label>
        </section>

        <!-- Память агента: три слоя, по разделу на каждый, в порядке от
             короткого к долгому. Разделы пусты в разметке намеренно — их
             наполняет `renderMemory` по ответу `GET /api/agents/{id}/memory`,
             и запрашивается он лениво, на открытие вкладки: панель
             перерисовывается на каждый обмен, а слои меняются заметно реже.

             Поля этого раздела нарочно **без** приставки `f-`: её носят поля
             конфига чата, которые пролив панели шлёт PATCH'ем. Память — не
             настройка чата, у неё свои ручки, и общий слушатель `change`
             на #panel-body отличает одно от другого ровно по этой приставке. -->
        <section class="tab-page hidden" id="tab-memory">
          <div class="mem-layer">
            <h3 class="mem-title">Краткосрочная — этот диалог</h3>
            <div class="mem-body" id="mem-short"></div>
          </div>

          <div class="mem-layer">
            <h3 class="mem-title">Рабочая — что выписано об этом чате</h3>
            <div class="mem-body" id="mem-working"></div>
          </div>

          <div class="mem-layer">
            <h3 class="mem-title">Долговременная — общая на все чаты</h3>
            <div class="mem-body" id="mem-long"></div>

            <!-- Форма добавления. Род записи выбирается явно и умолчания
                 не имеет ни здесь, ни на сервере: первым пунктом списка стоит
                 пустой «— выберите род —», а ручка отказывает и отсутствующему
                 ключу. «Явно выбирать, что и куда сохраняется» — единственная
                 работа пользователя в этом слое, и подставить её за него
                 не вправе ни сервер, ни форма. -->
            <label class="field">
              <span class="field-label">Что запомнить</span>
              <textarea id="mem-content" class="control area" rows="2"
                        placeholder="например: пишу на Kotlin"></textarea>
            </label>
            <div class="mem-add-row">
              <label class="field">
                <span class="field-label">Род записи</span>
                <!-- Опции пусты в разметке: их строит `fillKinds` из той же
                     карты родов, по которой подписаны записи в списке. Двумя
                     таблицами подписи разъехались бы молча. -->
                <select id="mem-kind" class="control"></select>
              </label>
              <button class="mem-add" id="mem-add" type="button">Запомнить</button>
            </div>
            <p class="hint" id="mem-status"></p>
          </div>
        </section>
      </div>

      <div class="panel-save">
        <div class="save-status" id="save-status"></div>
      </div>

      <div class="tiles" id="tiles"></div>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
